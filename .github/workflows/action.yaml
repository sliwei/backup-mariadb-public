name: 每小时备份数据库

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull
        uses: actions/checkout@v3 # git pull

      - name: set-timezone
        uses: szenius/set-timezone@v1.0 # 设置执行环境的时区
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Get current date
        id: date
        run: echo "::set-output name=time::$(date +'%Y%m%d%H%M%S')"

      - name: executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: bstu.cn
          username: root
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            echo ${{ steps.date.outputs.time }}
            docker exec mariadb sh -c "mariadb -uroot -p${{ secrets.SQL_PASSWORD }} -N -e \"SHOW DATABASES;\"" \
              | tr -d '\r' \
              | grep -Ev "^(information_schema|mysql|performance_schema|sys)$" \
              | xargs -r -I DB_NAME sh -c '
                  set -eu
                  backup_dir="/data/docker/mariadb/backup/DB_NAME"
                  backup_file="$backup_dir/${{ steps.date.outputs.time }}.dump"
                  mkdir -p "$backup_dir"
                  if docker exec mariadb sh -c "mariadb-dump -uroot -p${{ secrets.SQL_PASSWORD }} DB_NAME" > "$backup_file.tmp"; then
                    mv -- "$backup_file.tmp" "$backup_file"
                    find "$backup_dir" -maxdepth 1 -type f -name "*.dump" -printf "%f\n" \
                      | LC_ALL=C sort -r \
                      | tail -n +4 \
                      | while IFS= read -r old_backup; do
                          rm -- "$backup_dir/$old_backup"
                        done
                  else
                    rm -f -- "$backup_file.tmp"
                    exit 1
                  fi
                '
