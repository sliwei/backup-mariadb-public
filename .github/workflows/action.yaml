name: 每小时备份数据库

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull
        uses: actions/checkout@v3 # git pull

      - name: set-timezone
        uses: szenius/set-timezone@v1.0 # 设置执行环境的时区
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Get current date
        id: date
        run: echo "::set-output name=time::$(date +'%Y%m%d%H%M%S')"

      - name: executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: bstu.cn
          username: root
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            echo ${{ steps.date.outputs.time }}
            DB_LIST=$(docker exec mariadb sh -c "mariadb -uroot -p${{ secrets.SQL_PASSWORD }} -N -e \"SHOW DATABASES;\"" | grep -Ev "^(information_schema|mysql|performance_schema|sys)$")
            for DB_NAME in $DB_LIST; do
              mkdir -p "/data/docker/mariadb/backup/${DB_NAME}"
              docker exec mariadb sh -c "mariadb-dump -uroot -p${{ secrets.SQL_PASSWORD }} ${DB_NAME}" > "/data/docker/mariadb/backup/${DB_NAME}/${{ steps.date.outputs.time }}.dump"
            done
            find /data/docker/mariadb/backup -daystart -type f -name "*.dump" -mtime +6 -delete